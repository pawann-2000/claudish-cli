[package]
name = "claudish"
version = "0.1.0"
edition = "2021"
description = "Claudish <-> plain English translator; hooks into Claude Code to shrink prose that gets re-fed to the LLM"
license = "MIT"
repository = "https://github.com/pawann-2000/claudish-cli"

[dependencies]
paw-rs = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
reqwest = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
